name:  Automated Release

on:
  push:
    branches:
      - main

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Updated to v5 to fix the Node.js runner deprecation crash
    - name: Configure Java Development Kit 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Securely unlocks permissions using the codebase's original wrapper script
    - name: Initialize Compilation Infrastructure
      run: |
        chmod +x gradlew

    - name: Compile Official Android App Bundle (.AAB)
      run: ./gradlew app:bundleRelease -Pandroid.injected.signing.store.file="" --no-daemon

    - name: Calculate Dynamic Version Tag
      id: version_tag
      run: echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Compile and Publish Complete Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/bundle/release/app-release.aab"
        tag: ${{ steps.version_tag.outputs.tag }}
        name: "${{ steps.version_tag.outputs.tag }}"
        allowUpdates: true
        removeArtifacts: true
        body: |
          # Jarvis-Mobile ${{ steps.version_tag.outputs.tag }}

          An offline, privacy-first AI voice assistant and app launcher for Android devices. This release introduces a local web search routing engine.

          ### Changes
          * Integrated local intent routing to hand off web searches directly to DuckDuckGo.
          * Configured local prompt routing pipeline for search keyword detection.
          * Retained fully offline local inference fallback structure for device safety.

          ### System Requirements
          * **Minimum RAM:** 8GB
          * **Model Requirement:** Download `DeepSeek-R1-Distill-Llama-8B-abliterated.Q4_K_M.gguf` from Hugging Face and place it in the `app/src/main/assets/` directory before building.
        token: ${{ secrets.GITHUB_TOKEN }}
